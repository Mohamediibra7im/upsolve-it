name: Backend

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Run isolated integration tests
        run: npm run test:e2e -- --runInBand

      - name: Check all entrypoint types
        run: npm run typecheck

      - name: Audit all dependencies
        run: npm audit --audit-level=moderate

      - name: Build NestJS app
        run: npm run build
        env:
          NODE_ENV: production
          PORT: 5000
          FRONTEND_ORIGIN: http://localhost:3000
          JWT_SECRET: ci-test-secret-at-least-32-characters
          JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32
          MONGODB_URI: mongodb://localhost:27017/test

  deploy:
    name: Deploy upsolve-it-backend to Fly.io
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_BACKEND }}
